<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .team-hi{fill:#cfcfd1}.team{fill:#bdbdbe}.team-lo{fill:#93939a}
    .dark{fill:#43454d}.dark-hi{fill:#55575f}.light{fill:#d2d4d9}.glass{fill:#5b8ab4}
    .edge{stroke:#2b2d33;stroke-width:0.7;stroke-linejoin:round}
    .barrel{stroke:#43454d;stroke-width:3.4;stroke-linecap:round}
  </style>
  <g class="edge">
    <polygon class="dark-hi" points="32.3,23.7 37.6,21.2 51.2,40.7 45.9,43.3"/>
    <polygon class="dark" points="32.3,23.7 37.6,21.2 37.6,25.4 32.3,27.9"/>
    <polygon class="dark" points="37.6,21.2 51.2,40.7 51.2,44.9 37.6,25.4"/>
    <polygon class="dark-hi" points="12.8,33.0 18.1,30.5 31.7,50.1 26.4,52.6"/>
    <polygon class="dark" points="12.8,33.0 18.1,30.5 18.1,34.7 12.8,37.3"/>
    <polygon class="dark" points="18.1,30.5 31.7,50.1 31.7,54.3 18.1,34.7"/>
    <polygon class="team-hi" points="16.6,29.4 33.7,21.2 47.4,40.8 30.3,48.9"/>
    <polygon class="team" points="16.6,29.4 33.7,21.2 33.7,25.4 16.6,33.6"/>
    <polygon class="team-lo" points="33.7,21.2 47.4,40.8 47.4,45.0 33.7,25.4"/>
    <ellipse class="team-lo" cx="32.9" cy="36.7" rx="8.0" ry="6.6"/>
  </g>
  <!-- Drawn between the turret's base and its top so the turret covers the
       breech. Painting it last made the barrel appear to pierce the turret. -->
  <line class="barrel" x1="30.6" y1="31.4" x2="19.9" y2="16.0"/>
  <ellipse class="team-hi edge" cx="32.9" cy="33.0" rx="8.0" ry="6.6"/>
</svg>
